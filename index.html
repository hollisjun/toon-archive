<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TOON ARCHIVE — 일간 트렌드 & 인스타툰 레퍼런스</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f7f6f3;color:#222;font-family:-apple-system,BlinkMacSystemFont,Pretendard,sans-serif}
.app{max-width:1440px;margin:auto;padding:32px 24px}
header{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:24px;border-bottom:2px solid #222;padding-bottom:16px}
.logo{font-size:24px;font-weight:900;letter-spacing:-1px}
.grid{display:grid;grid-template-columns:2.4fr 1fr;gap:24px}
.panel{background:#fff;border:1px solid #e3e0d8;border-radius:16px;padding:24px}
.controls{display:flex;gap:12px;margin-bottom:16px;align-items:center}
select,input,button{border:1px solid #ddd;border-radius:8px;padding:8px 12px;font-size:13px}
.filter-btn{cursor:pointer;background:#fff;font-weight:600}
.filter-btn.active{background:#222;color:#fff;border-color:#222}
table{width:100%;border-collapse:collapse;margin-top:8px}
th,td{padding:14px 12px;text-align:left;border-bottom:1px solid #eee;font-size:13px;vertical-align:top}
th{background:#f9f8f5;font-weight:700;color:#555}
.rank-num{font-size:15px;font-weight:900;color:#888;text-align:center}
.tag{display:inline-block;padding:3px 7px;border-radius:4px;font-size:11px;font-weight:700}
.tag-직장{background:#e8f0fe;color:#1a73e8}
.tag-연애{background:#fce8e6;color:#d93025}
.tag-인스타툰{background:#f3e8fd;color:#7e22ce}
.comment-box{background:#faf9f6;border:1px solid #f0eee8;border-radius:8px;padding:8px 10px;margin-top:6px}
.comment-item{font-size:12px;color:#444;line-height:1.5;margin-bottom:4px;display:flex;justify-content:space-between;gap:8px}
.comment-item:last-child{margin-bottom:0}
.like-badge{color:#e67e22;font-weight:700;font-size:11px;white-space:nowrap}
.scores{display:flex;gap:4px;font-size:11px;margin-top:6px}
.score-badge{background:#f0eee9;padding:2px 6px;border-radius:4px;color:#555}
.link-btn{display:inline-block;margin-left:8px;background:#3b82f6;color:#fff;padding:3px 8px;border-radius:5px;font-size:11px;font-weight:bold;text-decoration:none;vertical-align:middle}
.link-btn:hover{background:#2563eb}
.memo-area{display:flex;gap:8px;margin-bottom:12px}
.memo-area input{flex:1}
.memo-item{padding:10px;background:#faf9f6;border:1px solid #eee;border-radius:8px;margin-bottom:8px;font-size:13px;display:flex;justify-content:space-between;align-items:center}
@media(max-width:900px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
<header>
  <div>
    <div class="logo">TOON TREND ARCHIVE</div>
    <div style="font-size:12px;color:#777;margin-top:4px">오늘의 직장/연애 썰 & 인기 인스타툰 레퍼런스 TOP</div>
  </div>
  <select id="dateSelect" onchange="switchDate(this.value)"></select>
</header>

<div class="grid">
  <section class="panel">
    <div class="controls">
      <button class="filter-btn active" onclick="filterCat('all', this)">전체 보기</button>
      <button class="filter-btn" onclick="filterCat('직장', this)">직장 썰</button>
      <button class="filter-btn" onclick="filterCat('연애', this)">연애 썰</button>
      <button class="filter-btn" onclick="filterCat('인스타툰', this)">인스타툰</button>
    </div>
    <div style="overflow-x:auto">
      <table>
        <thead>
          <tr>
            <th style="width:40px">#</th>
            <th style="width:70px">분류</th>
            <th>바이럴 제목 & 추천수 상위 베스트 댓글</th>
            <th style="width:140px">반응 요약 / 지표</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </section>

  <aside class="panel">
    <h3 style="margin-top:0;font-size:16px">내 소재 메모장</h3>
    <div class="memo-area">
      <input id="memoInput" placeholder="댓글 읽다 떠오른 컷 아이디어">
      <button onclick="addMemo()" style="background:#222;color:#fff;font-weight:700;cursor:pointer">저장</button>
    </div>
    <div id="memoList"></div>
  </aside>
</div>
</div>

<script>
let archiveData = [];
let currentDate = '';
let currentFilter = 'all';

async function loadData() {
  try {
    const res = await fetch('data.json?v=' + Date.now());
    archiveData = await res.json();
    if (archiveData.length > 0) {
      currentDate = archiveData[0].date;
      populateDateSelector();
      renderTable();
    }
  } catch (e) {
    console.error("데이터 로드 실패:", e);
  }
}

function populateDateSelector() {
  const sel = document.getElementById('dateSelect');
  sel.innerHTML = archiveData.map(d => `<option value="${d.date}">${d.date} 트렌드</option>`).join('');
}

function renderTable() {
  const day = archiveData.find(d => d.date === currentDate);
  if (!day) return;
  const filtered = currentFilter === 'all' ? day.items : day.items.filter(i => i.category === currentFilter);
  
  document.getElementById('tableBody').innerHTML = filtered.map(item => {
    // AI가 만든 링크 대신, 제목이나 키워드로 구글 검색을 하도록 안전한 링크 생성
    const searchQuery = encodeURIComponent(item.title || item.keyword);
    let searchUrl = `https://www.google.com/search?q=${searchQuery}`;
    
    // 인스타툰 카테고리면 인스타그램 안에서 검색하는 느낌으로 검색어 보강
    if(item.category === '인스타툰') {
      searchUrl = `https://www.google.com/search?q=site:instagram.com 인스타툰 ${searchQuery}`;
    }

    return `
      <tr>
        <td class="rank-num">${item.rank || '-'}</td>
        <td>
          <span class="tag tag-${item.category}">${item.category}</span>
          <div style="font-weight:700;font-size:12px;margin-top:4px;color:#555">${item.keyword}</div>
        </td>
        <td>
          <div style="font-weight:800;font-size:14px;color:#111">
            ${item.title}
            <a href="${searchUrl}" target="_blank" class="link-btn">🔍 원문 검색</a>
          </div>
          <div class="comment-box">
            ${(item.best_comments || []).map(c => `
              <div class="comment-item">
                <span>💬 ${c.text}</span>
                <span class="like-badge">👍 ${c.likes.toLocaleString()}</span>
              </div>
            `).join('')}
          </div>
        </td>
        <td>
          <div style="font-size:12px;color:#666;line-height:1.4">${item.reaction_summary || ''}</div>
          <div class="scores">
            <span class="score-badge">급상승 ${item.s[0]}</span>
            <span class="score-badge">수요 ${item.s[1]}</span>
            <span class="score-badge">적합 ${item.s[2]}</span>
          </div>
        </td>
      </tr>
    `;
  }).join('');
}

function switchDate(d) { currentDate = d; renderTable(); }
function filterCat(c, btn) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentFilter = c;
  renderTable();
}

let memos = JSON.parse(localStorage.getItem('myToonMemos') || '[]');
function addMemo() {
  const val = document.getElementById('memoInput').value.trim();
  if(!val) return;
  memos.unshift(val);
  localStorage.setItem('myToonMemos', JSON.stringify(memos));
  document.getElementById('memoInput').value = '';
  renderMemos();
}
function delMemo(idx) {
  memos.splice(idx, 1);
  localStorage.setItem('myToonMemos', JSON.stringify(memos));
  renderMemos();
}
function renderMemos() {
  document.getElementById('memoList').innerHTML = memos.map((m, idx) => `
    <div class="memo-item"><span>${m}</span><button onclick="delMemo(${idx})" style="border:none;background:none;color:#999;cursor:pointer">✕</button></div>
  `).join('');
}

loadData();
renderMemos();
</script>
</body>
</html>
